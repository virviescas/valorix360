name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev-lock.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        shell: bash
        run: python -m py_compile $(find . -maxdepth 2 -name '*.py' -not -path './.venv/*')

      - name: Run tests
        run: python -m pytest tests
